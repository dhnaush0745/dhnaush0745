<svg width="1200" height="300" viewBox="0 0 1200 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#0f172a"/>
</linearGradient>

<linearGradient id="line" x1="0" x2="1">
  <stop offset="0%" stop-color="#7dd3fc"/>
  <stop offset="50%" stop-color="#c4b5fd"/>
  <stop offset="100%" stop-color="#f9a8d4"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#1e293b"
        stroke-width="1"/>
</pattern>
```

  </defs>

  <!-- background -->

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- engineering grid -->

  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.45"/>

  <!-- top terminal bar -->

<rect x="0" y="0" width="1200" height="38"
     rx="18"
     fill="#0f172a"/>

  <circle cx="25" cy="19" r="5" fill="#475569"/>
  <circle cx="43" cy="19" r="5" fill="#475569"/>
  <circle cx="61" cy="19" r="5" fill="#475569"/>

<text x="88" y="24"
     fill="#64748b"
     font-family="monospace"
     font-size="13">
dhanush@engineering-console:~ </text>

  <!-- prompt -->

<text x="70" y="105"
     fill="#7dd3fc"
     font-family="monospace"
     font-size="16">
$ whoami </text>

  <!-- main name -->

<text x="70" y="155"
     fill="#f8fafc"
     font-family="monospace"
     font-size="50"
     font-weight="700">
DHANUSH.J </text>

  <!-- animated cursor -->

<rect x="390" y="119" width="10" height="46"
     fill="#7dd3fc"
     opacity="0.9"> <animate
   attributeName="opacity"
   values="1;0;1"
   dur="1s"
   repeatCount="indefinite"/> </rect>

  <!-- subtitle -->

<text x="74" y="190"
     fill="#94a3b8"
     font-family="monospace"
     font-size="17">
software engineer / backend / python </text>

  <!-- status -->

<text x="74" y="235"
     fill="#64748b"
     font-family="monospace"
     font-size="13">
[ SYSTEM READY ] </text>

<text x="210" y="235"
     fill="#7dd3fc"
     font-family="monospace"
     font-size="13">
BUILDING USEFUL SOFTWARE </text>

  <!-- animated scanning line -->

<rect x="0" y="285" width="260" height="2"
     fill="url(#line)"
     filter="url(#glow)"> <animate
   attributeName="x"
   from="-260"
   to="1200"
   dur="4s"
   repeatCount="indefinite"/> </rect>

  <!-- right-side metadata -->

<text x="910" y="105"
     fill="#64748b"
     font-family="monospace"
     font-size="12">
ENVIRONMENT </text>

<text x="910" y="130"
     fill="#c4b5fd"
     font-family="monospace"
     font-size="14">
PYTHON </text>

<text x="910" y="158"
     fill="#c4b5fd"
     font-family="monospace"
     font-size="14">
DJANGO </text>

<text x="910" y="186"
     fill="#c4b5fd"
     font-family="monospace"
     font-size="14">
SQL </text>

<text x="910" y="214"
     fill="#c4b5fd"
     font-family="monospace"
     font-size="14">
REST API </text>

</svg>
